<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ren'Py Analyzer — визуальный анализатор сценариев</title>

<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre/cytoscape-dagre.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 24px;
}

.container {
  max-width: 1600px;
  margin: 0 auto;
}

.header {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 20px 30px;
  margin-bottom: 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}

.header h1 {
  font-size: 28px;
  color: #764ba2;
  margin-bottom: 8px;
}

.header p {
  color: #666;
  font-size: 14px;
}

.controls {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 20px 30px;
  margin-bottom: 24px;
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.file-label {
  background: #f0f0f5;
  padding: 10px 20px;
  border-radius: 40px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.file-label:hover {
  background: #e0e0e8;
}

.file-label input {
  display: none;
}

.file-name {
  font-size: 14px;
  color: #666;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.analyze-btn {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  padding: 10px 28px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.analyze-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102,126,234,0.4);
}

.analyze-btn:active {
  transform: translateY(0);
}

.main-grid {
  display: grid;
  grid-template-columns: 320px 1fr 1fr;
  gap: 24px;
  margin-bottom: 24px;
  height: 600px;
}

.editor-panel {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.editor-panel h3 {
  font-size: 16px;
  margin-bottom: 12px;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 12px;
  border-bottom: 2px solid #f0f0f0;
  flex-shrink: 0;
}

.editor-wrapper {
  flex: 1;
  overflow: hidden;        /* ← скрываем внешний скролл */
  display: flex;
  flex-direction: column;
  min-height: 0;
}

#editor {
  height: 100%;            /* ← обязательно для CodeMirror */
  width: 100%;
}

.CodeMirror {
  height: 100% !important;
  flex: 1;
  border-radius: 12px;
  border: 1px solid #e0e0e8;
  font-size: 13px;
  line-height: 1.5;
}

.CodeMirror-scroll {
  overflow: auto !important;
  min-height: 100% !important;
}

.CodeMirror-sizer {
  overflow: visible !important;
}

.cm-unreachable {
  background: rgba(142, 142, 147, 0.3) !important;
}

.cm-state-error {
  background: rgba(175, 82, 222, 0.3) !important;
}

.cm-dead-end {
  background: rgba(231, 76, 60, 0.18) !important;
}

.unreachable {
  background-color: #8e8e93 !important;
  border: 2px solid #666 !important;
}

.missing {
  background-color: #ff9500 !important;
  border: 2px solid #cc7a00 !important;
}

.infinite {
  background-color: #ffcc00 !important;
  border: 2px solid #ccaa00 !important;
}

.bad-state {
  background-color: #af52de !important;
  border: 2px solid #8a41b3 !important;
}

.dead-end {
  background-color: #e74c3c !important;
  border: 2px solid #c0392b !important;
}

.download-btn {
  background: linear-gradient(135deg, #4CAF50, #2E7D32);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 12px;
  flex-shrink: 0;
}

.download-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
}

.report-panel {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.report-panel h3 {
  font-size: 16px;
  margin-bottom: 12px;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 12px;
  border-bottom: 2px solid #f0f0f0;
  flex-shrink: 0;
}

.report-content {
  font-size: 13px;
  line-height: 1.6;
  color: #444;
  font-family: 'SF Mono', Monaco, monospace;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
  padding-right: 8px;
}

.report-section {
  margin-bottom: 20px;
}

.report-section:last-child {
  margin-bottom: 0;
}

.report-section-title {
  font-weight: 600;
  margin-bottom: 8px;
  color: #333;
}

.report-section-content {
  padding-left: 0;
}

.recommendations-list {
  margin-top: 8px;
}

.recommendations-list p {
  margin-bottom: 4px;
}

.details-panel {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.details-panel h3 {
  font-size: 16px;
  margin-bottom: 12px;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.details-content {
  font-family: 'SF Mono', Monaco, 'Courier New', monospace;
  font-size: 12px;
  background: #f5f5f7;
  color: #333;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #e0e0e8;
  overflow: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
  flex: 1;
  min-height: 0;
  line-height: 1.6;
}

.graph-container {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.graph-container h3 {
  font-size: 16px;
  margin-bottom: 16px;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
}

#cy {
  width: 100%;
  height: 500px;
  background: #fafafa;
  border-radius: 12px;
  transition: all 0.2s;
}

.legend {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #eee;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #666;
}

.legend-color {
  width: 20px;
  height: 20px;
  border-radius: 6px;
}

.loading {
  text-align: center;
  padding: 40px;
  color: #999;
}

.empty-state {
  color: #999;
  font-style: italic;
  text-align: center;
  padding: 20px;
}

.paths-toggle {
  color: #667eea;
  cursor: pointer;
  font-style: italic;
  font-weight: 500;
  border-bottom: 1px dashed #667eea;
  transition: color 0.2s;
}

.paths-toggle:hover {
  color: #764ba2;
  border-bottom-color: #764ba2;
}

.paths-list {
  display: none;
  margin-top: 6px;
  padding: 8px 10px;
  background: rgba(102, 126, 234, 0.06);
  border-radius: 6px;
  border-left: 2px solid #667eea;
}

.paths-list.visible {
  display: block;
}

.paths-list div {
  font-size: 11px;
  color: #555;
  padding: 2px 0;
  white-space: normal;
  word-break: break-word;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: #f1f1f1;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb {
  background: #ccc;
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: #aaa;
}

/* ===== АДАПТИВНЫЙ ДИЗАЙН ===== */

/* Планшет: 2-колоночная раскладка, уменьшенные отступы */
@media (max-width: 1200px) {
  .main-grid {
    grid-template-columns: 280px 1fr;
    height: auto;
  }
  .editor-panel {
    grid-column: 1 / -1;
    min-height: 400px;
  }
}

/* Маленький планшет / большой телефон */
@media (max-width: 900px) {
  body {
    padding: 12px;
  }
  .main-grid {
    grid-template-columns: 1fr;
    height: auto;
    gap: 16px;
  }
  .main-grid > * {
    min-height: 300px;
  }
  .editor-panel {
    grid-column: auto;
  }
  .header, .controls, .graph-container {
    border-radius: 14px;
  }
  .header h1 {
    font-size: 22px;
  }
  #cy {
    height: 350px;
  }
  .legend {
    gap: 12px;
  }
}

/* Мобильный */
@media (max-width: 600px) {
  body {
    padding: 8px;
  }
  .header {
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 20px;
  }
  .header p {
    font-size: 12px;
  }
  .controls {
    padding: 12px 14px;
    gap: 10px;
    margin-bottom: 12px;
  }
  .file-label {
    padding: 10px 16px;
    font-size: 13px;
  }
  .file-name {
    max-width: 160px;
    font-size: 13px;
  }
  .analyze-btn, .download-btn {
    padding: 10px 18px;
    font-size: 13px;
  }
  .main-grid {
    gap: 12px;
  }
  .main-grid > * {
    min-height: 250px;
    border-radius: 14px;
    padding: 14px;
  }
  .report-panel h3,
  .details-panel h3,
  .editor-panel h3,
  .graph-container h3 {
    font-size: 14px;
    margin-bottom: 8px;
    padding-bottom: 8px;
  }
  .report-content {
    font-size: 12px;
  }
  .details-content {
    font-size: 11px;
    padding: 10px;
  }
  .CodeMirror {
    font-size: 12px;
  }
  .graph-container {
    padding: 14px;
  }
  #cy {
    height: 280px;
    border-radius: 8px;
  }
  .legend {
    gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
  }
  .legend-item {
    font-size: 11px;
    gap: 5px;
  }
  .legend-color {
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <h1>🎮 Novel Analyzer</h1>
    <p>Статический анализ сценариев визуальных новелл</p>
  </div>

  <div class="controls">
    <label class="file-label">
      Выбрать файл
      <input type="file" id="fileInput" accept=".rpy,.txt">
    </label>
    <span class="file-name" id="fileName">Файл не выбран</span>
    <button class="analyze-btn" onclick="analyze()">
      Анализировать
    </button>
    <button class="download-btn" style="margin-top:0; background:linear-gradient(135deg,#667eea,#764ba2);" onclick="downloadReport()">
      Скачать отчёт
    </button>
  </div>

  <div class="main-grid">
    <div class="report-panel">
      <h3>Отчёт об ошибках</h3>
      <div class="report-content" id="report">Нет данных для отображения</div>
    </div>

    <div class="details-panel">
      <h3>Детали узла</h3>
      <div class="details-content" id="nodeCode">Кликните на любой узел графа</div>
    </div>

    <div class="editor-panel">
      <h3>Редактор кода</h3>
      <div class="editor-wrapper">
        <div id="editor"></div>
      </div>
      <button class="download-btn" onclick="downloadFile()">Скачать файл</button>
    </div>
  </div>

  <div class="graph-container">
    <h3>Граф сюжета</h3>
    <div id="cy"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-color" style="background:#4a90e2;"></div>Достижимый узел</div>
      <div class="legend-item"><div class="legend-color" style="background:#8e8e93;"></div>Недостижимый узел</div>
      <div class="legend-item"><div class="legend-color" style="background:#ff9500;"></div>Ошибка перехода</div>
      <div class="legend-item"><div class="legend-color" style="background:#ffcc00;"></div>Потенциальный цикл</div>
      <div class="legend-item"><div class="legend-color" style="background:#af52de;"></div>Ошибка состояния</div>
      <div class="legend-item"><div class="legend-color" style="background:#e74c3c;"></div>Конечные узлы</div>
    </div>
  </div>
</div>

<script>
let cy;
let editor;
let currentFileContent = '';
let currentAnalysis = null; // Сохранить результаты анализа для деталей при клике на узел

// Инициализировать редактор CodeMirror
function initEditor() {
  if (editor) return;
  
  editor = CodeMirror(document.getElementById('editor'), {
    value: '',
    mode: 'python',
    theme: 'monokai',
    lineNumbers: true,
    lineWrapping: true,
    readOnly: false,
    viewportMargin: 100,  // Рендерить 100 строк выше/ниже видимой области для плавной прокрутки
    scrollbarStyle: 'native',  // Использовать нативный скроллбар для лучшей производительности
    lineWiseCopyCut: true,
    flattenSpans: true,  // Лучшая производительность для больших файлов
    addModeClass: true,  // Лучшая производительность подсветки синтаксиса
    wheelScrollLines: 3  // Включить прокрутку колёсиком мыши (3 строки за прокрутку)
  });
}

// Подсветка строк на основе результатов анализа — ПОЛНОСТЬЮ ОПТИМИЗИРОВАНО: без итераций, использовать только предвычисленные массивы строк
function highlightLines(analysis) {
  if (!editor) return;
  
  // Очистить предыдущую подсветку
  editor.operation(function() {
    editor.getAllMarks().forEach(function(mark) {
      mark.clear();
    });
  });
  
  // ВСЕ массивы предвычислены на бэкенде с информацией о строках — просто перебираем номера строк, а не узлы
  const allHighlights = [];
  
  // Собрать всю подсветку строк из предвычисленных массивов
  if (analysis.unreachable_with_lines?.length) {
    analysis.unreachable_with_lines.forEach(item => {
      if (item.line > 0) allHighlights.push({line: item.line, className: 'cm-unreachable', title: 'Недостижимый узел'});
    });
  }
  
  if (analysis.state_errors_with_lines?.length) {
    analysis.state_errors_with_lines.forEach(err => {
      if (err.line > 0) allHighlights.push({line: err.line, className: 'cm-state-error', title: 'Ошибка состояния'});
    });
  }
  
  if (analysis.terminal_nodes_with_lines?.length) {
    analysis.terminal_nodes_with_lines.forEach(item => {
      if (item.line > 0) allHighlights.push({line: item.line, className: 'cm-dead-end', title: 'Конечный узел'});
    });
  }
  
  // Применить всю подсветку за один проход
  editor.operation(function() {
    allHighlights.forEach(h => {
      const from = {line: h.line - 1, ch: 0};
      const to = {line: h.line - 1, ch: 1000};
      editor.markText(from, to, {className: h.className, title: h.title});
    });
  });
}

// Скачать текущее содержимое редактора как файл
function downloadFile() {
  if (!editor || !currentFileContent) return;
  
  const blob = new Blob([editor.getValue()], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'edited_script.rpy';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Set editor content
function setEditorContent(content) {
  if (editor) {
    editor.setValue(content);
    currentFileContent = content;
  }
}

// Получить текущее содержимое редактора
function getEditorContent() {
  return editor ? editor.getValue() : '';
}

document.getElementById('fileInput').addEventListener('change', function(e) {
  const fileName = e.target.files[0]?.name || 'Файл не выбран';
  document.getElementById('fileName').textContent = fileName;
});

async function analyze() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) {
    alert('Пожалуйста, выберите файл сценария');
    return;
  }

  const text = await file.text();

  // Инициализировать редактор, если ещё не инициализирован
  initEditor();
  
  // Установить содержимое редактора
  setEditorContent(text);

  document.getElementById('report').innerHTML = '<div class="loading">Анализ выполняется...</div>';
  document.getElementById('nodeCode').innerHTML = 'Кликните на любой узел графа';
  pathCounter = 0;

  try {
    const res = await fetch("http://127.0.0.1:8000/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code: text})
    });

    const data = await res.json();

    if (data.error) {
      document.getElementById('report').innerHTML = `<div style="color: #e74c3c;">Ошибка: ${escapeHtml(data.error)}</div>`;
      document.getElementById('nodeCode').innerHTML = 'Произошла ошибка при анализе';
      return;
    }

    if (cy) cy.destroy();

    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [...data.nodes, ...data.edges],

      style: [
        {
          selector: 'node',
          style: {
            'label': 'data(label)',
            'background-color': '#4a90e2',
            'color': '#fff',
            'text-valign': 'center',
            'text-halign': 'center',
            'width': 120,
            'height': 50,
            'text-wrap': 'wrap',
            'text-max-width': '100px',
            'padding': '10px',
            'border-width': 2,
            'border-color': '#ffffff',
            'font-size': '11px',
            'font-weight': '500',
            'overlay-padding': 10,
            'text-events': 'no'
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 2,
            'line-color': '#ccc',
            'target-arrow-color': '#ccc',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier'
          }
        },
        { selector: '.dead-end', style: { 'background-color': '#e74c3c', 'border-color': '#c0392b' }},
        { selector: '.bad-state', style: { 'background-color': '#af52de' }},
        { selector: '.infinite', style: { 'background-color': '#ffcc00' }},
        { selector: '.missing', style: { 'background-color': '#ff9500' }},
        { selector: '.unreachable', style: { 'background-color': '#8e8e93' }}
      ],

      layout: {
        name: 'dagre',
        rankDir: 'TB',
        animate: true,
        animationDuration: 300
      }
    });

    // Сохранить анализ для деталей при клике на узел
    currentAnalysis = data.analysis;
    
    // Подсветить строки в редакторе (всё ещё нужно для подсветки кода)
    highlightLines(data.analysis);

    cy.on('click', 'node', function(evt) {
      const n = evt.target;
      const summary = n.data('summary') || 'Нет описания';
      const code = n.data('code') || 'Нет кода';
      const line = n.data('line');
      const warnings = n.data('warnings') || []; // Использовать предвычисленные предупреждения с бэкенда
      
      // Построить HTML с деталями узла
      let detailsHtml = `
        <strong>Узел: ${n.id()}</strong>
        ${line ? `<br><span style="color: #666;">Строка: ${line}</span>` : ''}
        <br><br>
        Описание:<br>${escapeHtml(summary)}
        <br><br>
        Код:<br>${escapeHtml(code)}
      `;
      
      // Отобразить предвычисленные предупреждения — итерация не нужна
      if (warnings.length > 0) {
        detailsHtml += '<br><br><div style="border-top: 2px solid #e74c3c; padding-top: 12px;">';
        detailsHtml += '<strong style="color: #e74c3c;">⚠️ Предупреждения:</strong><br><br>';
        warnings.forEach(warning => {
          detailsHtml += `<div style="margin-bottom: 8px; padding: 8px; background: rgba(231, 76, 60, 0.05); border-left: 3px solid #e74c3c; border-radius: 4px;">
            <strong>${warning.icon} ${warning.title}</strong><br>
            <span style="font-size: 11px;">${warning.details}</span>
          </div>`;
        });
        detailsHtml += '</div>';
      }
      
      document.getElementById("nodeCode").innerHTML = detailsHtml;
    });

    let hasErrors = false;
    let reportHtml = '';
    const analysis = data.analysis || {};

    // ОПТИМИЗИРОВАНО: прямая отрисовка без итерации — использовать предвычисленные массивы
    if (analysis.unreachable?.length) {
      hasErrors = true;
      reportHtml += '<div class="report-section">';
      reportHtml += '<div class="report-section-title">Недостижимые узлы</div>';
      reportHtml += `<div class="report-section-content" style="color:#8e8e93;">${analysis.unreachable.join(', ')}</div>`;
      reportHtml += '</div>';
    }

    if (analysis.missing?.length) {
      hasErrors = true;
      reportHtml += '<div class="report-section">';
      reportHtml += '<div class="report-section-title">Ошибки переходов</div>';
      reportHtml += `<div class="report-section-content" style="color:#ff9500;">${analysis.missing.join(', ')}</div>`;
      reportHtml += '</div>';
    }

    if (analysis.infinite_loops?.length) {
      hasErrors = true;
      reportHtml += '<div class="report-section">';
      reportHtml += '<div class="report-section-title">Потенциальные циклы</div>';
      reportHtml += `<div class="report-section-content" style="color:#ffcc00;">${analysis.infinite_loops.length}</div>`;
      reportHtml += '</div>';
    }

    // Использовать агрегированные ошибки состояний с бэкенда, чтобы избежать дубликатов
    if (analysis.state_impossible_aggregated?.length) {
      hasErrors = true;
      reportHtml += '<div class="report-section">';
      reportHtml += '<div class="report-section-title">Ошибки состояний</div>';
      reportHtml += '<div class="report-section-content">';
      analysis.state_impossible_aggregated.forEach(p => {
        const rangeInfo = p.ranges && p.ranges.length > 0 ? `[${p.ranges[0][0]}, ${p.ranges[0][1]}]` : '[null, null]';
        const pathInfo = p.paths && p.paths.length > 0 ? p.paths[0].join(' → ') : '';
        const typeInfo = p.type === 'flag' ? ' (флаг)' : '';
        reportHtml += `<div style="margin-bottom: 12px; padding-left: 12px; border-left: 3px solid #af52de;">
          <strong>${p.label}${typeInfo}</strong><br>
          Требуется: ${p.var} ${p.type === 'flag' ? '' : '≥'} ${p.required}<br>
          Диапазон: ${rangeInfo}<br>
          Путь: ${pathInfo}${renderPathsToggle(p.paths, p.occurrences)}
        </div>`;
      });
      reportHtml += '</div></div>';
    }

    if (analysis.state_always_true_aggregated?.length) {
      hasErrors = true;
      reportHtml += '<div class="report-section">';
      reportHtml += '<div class="report-section-title">⚠️ Всегда истинные условия</div>';
      reportHtml += '<div class="report-section-content">';
      analysis.state_always_true_aggregated.forEach(p => {
        const lineInfo = p.line ? ` (строка ${p.line})` : '';
        const rangeInfo = p.ranges && p.ranges.length > 0 ? `[${p.ranges[0][0]}, ${p.ranges[0][1]}]` : '';
        const firstPath = p.paths && p.paths.length > 0 ? p.paths[0].join(' → ') : '';
        reportHtml += `<div style="margin-bottom: 12px; padding-left: 12px; border-left: 3px solid #ff9800;">
          <strong>${p.label}${lineInfo}</strong><br>
          Условие: ${p.var} ${p.op} ${p.value} всегда истинно<br>
          ${rangeInfo ? `Диапазон: ${rangeInfo}<br>` : ''}
          Путь: ${firstPath}${renderPathsToggle(p.paths, p.occurrences)}
        </div>`;
      });
      reportHtml += '</div></div>';
    }

    if (analysis.state_flag_contradictions_aggregated?.length) {
      hasErrors = true;
      reportHtml += '<div class="report-section">';
      reportHtml += '<div class="report-section-title">🚩 Противоречия в состоянии флагов</div>';
      reportHtml += '<div class="report-section-content">';
      analysis.state_flag_contradictions_aggregated.forEach(fc => {
        const lineInfo = fc.line ? ` (строка ${fc.line})` : '';
        const valuesInfo = fc.values.join(', ');
        const pathInfo = fc.paths && fc.paths.length > 0 ? fc.paths[0].join(' → ') : '';
        reportHtml += `<div style="margin-bottom: 12px; padding-left: 12px; border-left: 3px solid #f44336;">
          <strong>${fc.label}${lineInfo}</strong><br>
          Флаг: ${fc.var}<br>
          Значения на разных путях: ${valuesInfo}<br>
          Путь: ${pathInfo}${renderPathsToggle(fc.paths, fc.occurrences)}
        </div>`;
      });
      reportHtml += '</div></div>';
    }

    if (analysis.terminal_nodes?.length) {
      hasErrors = true;
      reportHtml += '<div class="report-section">';
      reportHtml += '<div class="report-section-title">Конечные узлы</div>';
      reportHtml += `<div class="report-section-content" style="color:#e74c3c;">${analysis.terminal_nodes.join(', ')}</div>`;
      reportHtml += '</div>';
    }

    if (data.recommendations?.length) {
      hasErrors = true;
      reportHtml += '<div class="report-section">';
      reportHtml += '<div class="report-section-title">Рекомендации</div>';
      reportHtml += '<div class="report-section-content recommendations-list">';
      data.recommendations.forEach(r => {
        reportHtml += `<p>• ${escapeHtml(r)}</p>`;
      });
      reportHtml += '</div></div>';
    }

    if (!hasErrors) {
      reportHtml = '<div class="empty-state">Ошибок не найдено. Сценарий корректен!</div>';
    }

    document.getElementById("report").innerHTML = reportHtml;

  } catch (err) {
    console.error(err);
    document.getElementById('report').innerHTML = `<div style="color: #e74c3c;">Ошибка: ${err.message}</div>`;
    document.getElementById('nodeCode').innerHTML = 'Ошибка подключения к серверу';
  }
}

function togglePaths(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const toggle = el.previousElementSibling;
  if (el.classList.contains('visible')) {
    el.classList.remove('visible');
    if (toggle) toggle.textContent = toggle.textContent.replace('▲ скрыть пути', '▼ показать пути');
  } else {
    el.classList.add('visible');
    if (toggle) toggle.textContent = toggle.textContent.replace('▼ показать пути', '▲ скрыть пути');
  }
}

let pathCounter = 0;

function renderPathsToggle(paths, occurrences) {
  if (!paths || paths.length <= 1) return '';
  const id = 'paths-' + (++pathCounter);
  let html = `<span class="paths-toggle" onclick="togglePaths('${id}')">▼ показать пути</span>`;
  html += `<div class="paths-list" id="${id}">`;
  paths.forEach((p, i) => {
    html += `<div>${i + 1}. ${p.join(' → ')}</div>`;
  });
  html += '</div>';
  return html;
}

function downloadReport() {
  const reportEl = document.getElementById('report');
  if (!reportEl || reportEl.textContent.trim() === 'Нет данных для отображения') {
    alert('Сначала выполните анализ сценария');
    return;
  }

  const now = new Date();
  const ts = now.getFullYear().toString() +
    String(now.getMonth() + 1).padStart(2, '0') +
    String(now.getDate()).padStart(2, '0') + '_' +
    String(now.getHours()).padStart(2, '0') +
    String(now.getMinutes()).padStart(2, '0') +
    String(now.getSeconds()).padStart(2, '0');

  const html = `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отчёт Ren'Py Analyzer — ${ts}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #333; }
  h1 { color: #764ba2; font-size: 22px; margin-bottom: 4px; }
  .timestamp { color: #999; font-size: 12px; margin-bottom: 24px; }
  .report-section { margin-bottom: 20px; padding: 16px; background: #fafafa; border-radius: 12px; border: 1px solid #eee; }
  .report-section-title { font-weight: 600; font-size: 15px; margin-bottom: 8px; color: #333; }
  .report-section-content { font-size: 13px; line-height: 1.6; }
  .paths-list { margin-top: 6px; padding: 8px 10px; background: rgba(102,126,234,0.06); border-radius: 6px; border-left: 2px solid #667eea; }
  .paths-list div { font-size: 11px; color: #555; padding: 2px 0; }
</style>
</head>
<body>
<h1>🎮 Ren'Py Analyzer — Отчёт</h1>
<div class="timestamp">${now.toLocaleString('ru-RU')}</div>
${reportEl.innerHTML}
</body>
</html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `report_${ts}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
