[tool:pytest]
# pytest configuration
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests/

# Coverage configuration
[coverage:run]
source = core/
include = */core/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.: